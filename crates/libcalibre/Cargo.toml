[package]
name = "libcalibre"
version = "1.0.0"
edition = "2021"
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = { version = "0.4.31", features = ["serde"] }
diesel = { version = "2.2.4", features = ["sqlite", "chrono", "r2d2", "returning_clauses_for_sqlite_3_35"] }
epub = "2.1.1"
mobi = "0.8.0"
percent-encoding = "2.3"
regex = "1.10.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.6.1", features = [ "v4", "fast-rng", ] }
sanitise-file-name = "1.0.0"
# Same major as epub's, so the cover reader shares its archive code.
zip = { version = "3", default-features = false, features = ["deflate"] }
# Search folds diacritics (Vietnamese `sach` finds `Sách`) before comparing.
unicode-normalization = "0.1"

# Windows runners have no system libsqlite3 to link against. Enabling the
# bundled build here covers every crate in a desktop/test build, since Cargo
# unifies this package's features across the dependency graph. Keep the
# version in step with the one diesel resolves in Cargo.lock.
[target.'cfg(windows)'.dependencies]
libsqlite3-sys = { version = "0.30.1", features = ["bundled"] }

[dev-dependencies]
fastrand = "2.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
insta = { version = "1.40", features = ["yaml"] }
proptest = "1.4"
rusqlite = "0.32"
serde_yaml = "0.9"
tempfile = "3.8"
