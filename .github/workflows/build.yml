name: Build
on:
  push:
    branches:
      - main
  pull_request:
  # Lets a maintainer (or a fork owner) run the desktop matrix — Ubuntu and
  # Windows — without waiting for a push.
  workflow_dispatch:

jobs:
  build_app:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          workspaces: "."

      - name: (Ubuntu only) Install dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install node packages
        run: bun install

      - name: List installed versions
        run: |
          bun --version;
          cargo --version;
          bun tauri --version

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun tauri
          # Verbose so a bundling failure shows the script's output.
          args: --verbose

      - name: (Ubuntu only) Upload build artifacts
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-and-appimage
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

      - name: (Windows only) Upload MSI installer
        if: matrix.platform == 'windows-2022'
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: target/release/bundle/msi/*.msi

      - name: (Windows only) Upload NSIS installer
        if: matrix.platform == 'windows-2022'
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: target/release/bundle/nsis/*.exe

      - name: (Windows only) Package portable build
        if: matrix.platform == 'windows-2022'
        shell: pwsh
        run: |
          $candidates = @("target/release/Citadel.exe", "target/release/citadel-desktop.exe")
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            throw "No Citadel executable found in target/release"
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Copy-Item $exe "Citadel_${version}_x64_portable.exe"

      - name: (Windows only) Upload portable executable
        if: matrix.platform == 'windows-2022'
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-exe
          path: Citadel_*_x64_portable.exe
